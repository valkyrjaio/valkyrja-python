[project]
name = "valkyrja-python-ci-mypy"
version = "0.0.0"
requires-python = ">=3.14"
# mypy checks `tests` as well as `src`, so it resolves what a test imports.
# `pytest` is what every test imports, and mypy reports an unresolved import as
# an error.
dependencies = ["mypy>=2.3.0,<3", "pytest>=9.1.1,<10"]

[tool.uv]
# Environment-only project: install the tool, never build this directory.
package = false

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
# PEP 420 namespace package: `valkyrja` has no __init__.py, so mypy needs
# namespace mode with `src` as the explicit package base.
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
