[project]
name = "valkyrja-python-ci-importlinter"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["import-linter>=2.15,<3"]

[tool.uv]
# Environment-only project: install the tool, never build this directory.
package = false

# import-linter enforces module boundaries. The root poe task sets PYTHONPATH=src
# so `valkyrja` is importable.
[tool.importlinter]
root_packages = ["valkyrja"]
include_external_packages = true

# The framework has zero build and AST dependencies. The contract sees direct
# imports only, so a transitive dependency still needs review.
[[tool.importlinter.contracts]]
name = "The framework does not import sindri or an AST library"
type = "forbidden"
source_modules = ["valkyrja"]
forbidden_modules = [
    "ast",
    "ast_grep_py",
    "astroid",
    "baron",
    "griffe",
    "jedi",
    "libcst",
    "parso",
    "redbaron",
    "rope",
    "sindri",
    "tree_sitter",
]
